spring.application.name=smartbite-main-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartbite_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

wallet.service.base-url=${WALLET_SERVICE_URL:http://localhost:8082}
internal.api.key=${INTERNAL_API_KEY}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
